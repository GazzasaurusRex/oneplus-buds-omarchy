[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oneplus-buds"
version = "0.1.0"
description = "Linux backend for OPO-compatible OnePlus earbuds"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/GazzasaurusRex/oneplus-buds-omarchy"
Issues = "https://github.com/GazzasaurusRex/oneplus-buds-omarchy/issues"

[project.scripts]
oneplus-buds = "oneplus_buds.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
